<!DOCTYPE html>
<html>

<head>
    <title>Vue Jobs API</title>
</head>

<body>
    <h1>Vue Jobs Backend API</h1>
    <p>This is the backend API for the Vue Jobs application.</p>
    <p>Available endpoints:</p>
    <ul>
        <li><a href="/jobs">GET /jobs</a> - Get all jobs</li>
        <li>POST /jobs - Create a new job</li>
        <li>GET /jobs/:id - Get a specific job</li>
        <li>PUT /jobs/:id - Update a job</li>
        <li>DELETE /jobs/:id - Delete a job</li>
    </ul>
</body>

</html>
